[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-nash"
version = "0.1.0"
description = "Pure vs. mixed Nash Q-iteration for the CS540 A10 soccer Markov game"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["soccer_nash"]
