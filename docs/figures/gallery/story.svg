<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" role="img" aria-label="summary: mechanism chain and algorithmic triangle">
<defs><marker id="sa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--rule-strong, #b7c4b9)"/></marker></defs>
<text x="16" y="22" font-family="Barlow Semi Condensed,sans-serif" font-weight="700" font-size="15" fill="var(--ink, #19211c)">Where mixing comes from, and what the solver does about it</text>
<rect x="40" y="44" width="200" height="34" rx="4" fill="var(--tint, #eef2ec)" stroke="var(--rule-strong, #b7c4b9)" stroke-width="1.2"/><text x="140" y="65" text-anchor="middle" font-family="Barlow Semi Condensed,sans-serif" font-size="11" fill="var(--ink, #19211c)"><tspan x="140" dy="0">goal-mouth width</tspan></text>
<line x1="95" y1="78" x2="70" y2="104" stroke="var(--rule-strong, #b7c4b9)" stroke-width="1.4" marker-end="url(#sa)"/><text x="88" y="94" font-family="ui-monospace,monospace" font-size="9" fill="var(--ink-faint, #77817a)">= 1</text>
<line x1="185" y1="78" x2="210" y2="104" stroke="var(--rule-strong, #b7c4b9)" stroke-width="1.4" marker-end="url(#sa)"/><text x="204" y="94" font-family="ui-monospace,monospace" font-size="9" fill="var(--ink-faint, #77817a)">&#8805; 2</text>
<rect x="32" y="104" width="96" height="34" rx="4" fill="var(--tint, #eef2ec)" stroke="var(--rule-strong, #b7c4b9)" stroke-width="1.2"/><text x="80" y="125" text-anchor="middle" font-family="Barlow Semi Condensed,sans-serif" font-size="11" fill="var(--p0, #2f6bb0)"><tspan x="80" dy="-6">PURE</tspan><tspan x="80" dy="13">only</tspan></text>
<rect x="144" y="104" width="104" height="34" rx="4" fill="var(--tint, #eef2ec)" stroke="var(--rule-strong, #b7c4b9)" stroke-width="1.2"/><text x="196" y="125" text-anchor="middle" font-family="Barlow Semi Condensed,sans-serif" font-size="11" fill="var(--ember, #a94e18)"><tspan x="196" dy="-6">candidate</tspan><tspan x="196" dy="13">mixed states</tspan></text>
<line x1="196" y1="138" x2="196" y2="162" stroke="var(--rule-strong, #b7c4b9)" stroke-width="1.4" marker-end="url(#sa)"/>
<rect x="80" y="162" width="168" height="34" rx="4" fill="var(--tint, #eef2ec)" stroke="var(--rule-strong, #b7c4b9)" stroke-width="1.2"/><text x="164" y="183" text-anchor="middle" font-family="Barlow Semi Condensed,sans-serif" font-size="11" fill="var(--ink, #19211c)"><tspan x="164" dy="-6">+ stochastic move order</tspan><tspan x="164" dy="13">+ defender can't cover both lanes</tspan></text>
<line x1="164" y1="196" x2="164" y2="220" stroke="var(--rule-strong, #b7c4b9)" stroke-width="1.4" marker-end="url(#sa)"/>
<rect x="80" y="220" width="168" height="32" rx="4" fill="var(--tint, #eef2ec)" stroke="var(--rule-strong, #b7c4b9)" stroke-width="1.2"/><text x="164" y="240" text-anchor="middle" font-family="Barlow Semi Condensed,sans-serif" font-size="11" fill="var(--ink, #19211c)"><tspan x="164" dy="0">crossing best replies</tspan></text>
<line x1="164" y1="252" x2="164" y2="276" stroke="var(--rule-strong, #b7c4b9)" stroke-width="1.4" marker-end="url(#sa)"/>
<rect x="80" y="276" width="168" height="32" rx="4" fill="var(--tint, #eef2ec)" stroke="var(--rule-strong, #b7c4b9)" stroke-width="1.2"/><text x="164" y="296" text-anchor="middle" font-family="Barlow Semi Condensed,sans-serif" font-size="11" fill="var(--ember, #a94e18)"><tspan x="164" dy="0">2x2 matching pennies</tspan></text>
<line x1="164" y1="308" x2="164" y2="332" stroke="var(--rule-strong, #b7c4b9)" stroke-width="1.4" marker-end="url(#sa)"/>
<rect x="80" y="332" width="168" height="34" rx="4" fill="var(--tint, #eef2ec)" stroke="var(--rule-strong, #b7c4b9)" stroke-width="1.2"/><text x="164" y="353" text-anchor="middle" font-family="Barlow Semi Condensed,sans-serif" font-size="11" fill="var(--ink, #19211c)"><tspan x="164" dy="-6">mixed equilibrium</tspan><tspan x="164" dy="13">(LP needed here only)</tspan></text>
<text x="550" y="86" text-anchor="middle" font-family="Barlow Semi Condensed,sans-serif" font-weight="600" font-size="12" fill="var(--ink, #19211c)">three backups</text>
<path d="M550 100 L460 230 L640 230 Z" fill="none" stroke="var(--rule-strong, #b7c4b9)" stroke-width="1.2"/>
<rect x="500" y="82" width="100" height="30" rx="4" fill="none" stroke="none" stroke-width="1.2"/><text x="550" y="101" text-anchor="middle" font-family="Barlow Semi Condensed,sans-serif" font-size="12" fill="var(--p0, #2f6bb0)"><tspan x="550" dy="0">PURE</tspan></text>
<text x="550" y="118" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="var(--ink-faint, #77817a)">fast, sometimes short</text>
<rect x="414" y="232" width="92" height="26" rx="4" fill="none" stroke="none" stroke-width="1.2"/><text x="460" y="249" text-anchor="middle" font-family="Barlow Semi Condensed,sans-serif" font-size="12" fill="var(--ink, #19211c)"><tspan x="460" dy="0">HYBRID</tspan></text>
<text x="460" y="270" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="var(--ink-faint, #77817a)">exact, selective LP</text>
<rect x="594" y="232" width="92" height="26" rx="4" fill="none" stroke="none" stroke-width="1.2"/><text x="640" y="249" text-anchor="middle" font-family="Barlow Semi Condensed,sans-serif" font-size="12" fill="var(--ember, #a94e18)"><tspan x="640" dy="0">MIXED</tspan></text>
<text x="640" y="270" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="var(--ink-faint, #77817a)">exact, all LP</text>
<rect x="420" y="306" width="240" height="28" rx="4" fill="var(--tint, #eef2ec)" stroke="var(--rule-strong, #b7c4b9)" stroke-width="1.2"/><text x="540" y="324" text-anchor="middle" font-family="Barlow Semi Condensed,sans-serif" font-size="10" fill="var(--ink, #19211c)"><tspan x="540" dy="0">deterministic:  pure = hybrid = mixed</tspan></text>
<rect x="420" y="338" width="240" height="28" rx="4" fill="var(--tint, #eef2ec)" stroke="var(--rule-strong, #b7c4b9)" stroke-width="1.2"/><text x="540" y="356" text-anchor="middle" font-family="Barlow Semi Condensed,sans-serif" font-size="10" fill="var(--ink, #19211c)"><tspan x="540" dy="0">random order:  pure &lt; hybrid = mixed</tspan></text>
<rect x="420" y="376" width="240" height="46" rx="4" fill="var(--tint, #eef2ec)" stroke="var(--ember, #a94e18)" stroke-width="1.2"/>
<text x="540" y="397" text-anchor="middle" font-family="Barlow Semi Condensed,sans-serif" font-weight="700" font-size="12.5" fill="var(--ember, #a94e18)">3.95% of states &#8594; 41% of the equilibrium path</text>
<text x="540" y="413" text-anchor="middle" font-family="ui-monospace,monospace" font-size="8.5" fill="var(--ink-faint, #77817a)">rare to store, common to use</text>
</svg>